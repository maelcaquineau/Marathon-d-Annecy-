<title>Marathon d'Annecy 2027 — Plan d'entraînement</title>
<meta name="description" content="Plan d'entraînement personnalisé pour le marathon d'Annecy 2027 : compte à rebours, calendrier des séances et suivi kilométrique, synchronisé via Supabase.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%94%EF%B8%8F</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#1A2B32; --muted:#5C6B6F; --faint:#8A9A9E; --bg:#F5F8F7; --border:#E3E8E7;
  --primary:#1F6F8B; --primary-dark:#123B4A; --gold:#D9A441; --gold-deep:#A8790A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
button{font-family:inherit;cursor:pointer;background:none;border:none;padding:0;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}
code{background:#EEF1F0;padding:2px 6px;border-radius:4px;font-size:0.9em;}

/* centered messages (loading / setup / error) */
.center-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.center-msg-inner{max-width:480px;color:var(--muted);}
.center-msg-inner h2{font-family:'Oswald',sans-serif;color:var(--ink);font-size:20px;margin:0 0 12px;}
.center-msg-inner p{line-height:1.6;margin:0 0 10px;}

/* sync error banner */
.sync-banner{background:#FBEAE8;color:#B5453D;font-size:13px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:60;}
.sync-banner button{display:flex;flex-shrink:0;color:#B5453D;}
.modal-error{background:#FBEAE8;color:#B5453D;font-size:13px;padding:8px 10px;border-radius:8px;margin-bottom:12px;line-height:1.4;}

/* header */
.header{background:var(--primary-dark);position:relative;overflow:hidden;}
.header-inner{padding:32px 20px 64px;position:relative;z-index:2;max-width:900px;margin:0 auto;}
.eyebrow{display:flex;align-items:center;gap:8px;color:#9FC1CC;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;color:#fff;margin:0 0 22px;}
.countdown{display:flex;margin-left:-10px;}
.countdown-unit{padding:0 10px;text-align:center;}
.countdown-value{font-family:'Oswald',sans-serif;font-weight:700;font-size:2.4rem;color:#F2C868;line-height:1;}
.countdown-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FC1CC;margin-top:8px;}
.race-info{font-size:14px;color:#7FA6B3;margin-top:18px;}
.mountains{position:absolute;bottom:0;left:0;width:100%;height:56px;opacity:.5;}

/* stats */
.stats{display:flex;flex-wrap:wrap;background:#fff;margin-top:-32px;border-radius:12px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;z-index:2;}
.stat{flex:1;min-width:140px;padding:14px 18px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);}
.stat-value{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:var(--ink);margin-top:2px;}
.stat-sub{font-size:12px;color:var(--faint);margin-top:2px;}

/* calendar controls */
.cal-section{margin-top:32px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.icon-btn{padding:6px;border-radius:8px;display:flex;color:var(--ink);}
.icon-btn:hover{background:#fff;}
.cal-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;width:170px;text-align:center;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* calendar grid — fixed equal-width columns with wrapping text */
.calendar{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
.cal-weekday{text-align:center;font-size:11px;font-weight:600;color:var(--faint);padding:8px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day-cell{min-height:100px;min-width:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px;cursor:pointer;background:#fff;transition:background .15s;}
.day-cell.out{background:#FAFBFA;}
.day-cell.drag-over{background:#EAF3F0;}
.day-num{font-size:13px;color:#33454B;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;}
.day-cell.out .day-num{color:#B7C1C0;}
.day-num.today{background:var(--primary);color:#fff;border-radius:50%;font-weight:700;}

.pill{display:block;width:100%;text-align:left;border:1px solid;border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:11px;line-height:1.35;cursor:grab;}
.pill:active{cursor:grabbing;}
.pill-title{display:flex;align-items:flex-start;gap:4px;font-weight:500;min-width:0;white-space:normal;word-break:break-word;overflow-wrap:break-word;}
.pill-title svg{flex-shrink:0;margin-top:2px;}
.pill-km{opacity:.8;margin-top:1px;}
.pill.missed{opacity:.5;}

/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:28px;}
.card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:14px;}

/* chart */
.chart-scroll{overflow-x:auto;padding-bottom:4px;}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:100px;}
.bar-col{width:11px;height:100%;display:flex;align-items:flex-end;flex-shrink:0;}
.bar{width:100%;border-radius:2px 2px 0 0;background:#B9D4E5;}
.bar.current{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold-deep);}
.chart-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:6px;}

/* pace table */
.pace-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;font-size:14px;}
.pace-label{font-size:12px;color:var(--faint);}
.pace-value{font-weight:600;color:var(--ink);margin-top:1px;}
.pace-note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.5;}

.reset-row{display:flex;justify-content:center;margin:22px 0 40px;}
.reset-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);}
.confirm-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:center;}
.btn-danger{background:#B5453D;color:#fff;padding:6px 12px;border-radius:6px;font-weight:600;}
.btn-ghost{background:#F0F2F1;color:var(--muted);padding:6px 12px;border-radius:6px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,34,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;}
.field{margin-bottom:12px;}
.field label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid #D7DEDD;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);}
.field textarea{resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:14px 0 0;cursor:pointer;font-size:14px;font-weight:500;}
.checkbox-row input{width:16px;height:16px;}
.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
.btn-cancel{background:#F0F2F1;color:var(--muted);padding:9px 16px;border-radius:8px;font-size:14px;}
.btn-save{background:var(--primary);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;}
.btn-delete{color:#B5453D;font-size:14px;display:flex;align-items:center;gap:5px;padding:8px 10px;border-radius:8px;}

@media (max-width:640px){
  .header-inner{padding:24px 16px 56px;}
  .h1{font-size:22px;}
  .countdown-value{font-size:1.8rem;}
  .countdown-unit{padding:0 8px;}
  .stat{min-width:calc(50% - 1px);}
  .day-cell{min-height:78px;padding:3px;}
  .pill{font-size:10px;padding:3px 5px;}
  .cal-title{width:auto;}
}
</style>

/* ================================================================
   FONCTIONS UTILITAIRES
   ================================================================ */
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function todayStr(){ return fmtDate(new Date()); }
function isoWeekBounds(d){
  const mon = addDays(d, -((d.getDay()+6)%7));
  const sun = addDays(mon,6);
  return { mon: fmtDate(mon), sun: fmtDate(sun) };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mkSession(idx,date,cat,title,km,week,phase){
  return { id:`s${idx}`, date, cat, title, km, week, phase, completed:false, actualKm:null, actualMin:null, notes:"" };
}

function generateDefaultSessions(){
  const firstMonday = new Date(2026,8,7); // lundi 7 septembre 2026
  const sessions = [];
  let c = 0;
  WEEK_PLAN.forEach((w,i)=>{
    const monday = addDays(firstMonday, 7*i);
    const at = (off)=>fmtDate(addDays(monday,off));
    const week = i+1;

    if (w.phase === "RACE") {
      const tue = at(1);
      if (tue >= START_DATE) sessions.push(mkSession(c++, tue, "easy", w.quality.title, w.quality.km, week, w.phase));
      sessions.push(mkSession(c++, at(6), "race", w.longTitle, w.long, week, w.phase));
      return;
    }
    if (w.freq === 4 && w.mon > 0) {
      sessions.push(mkSession(c++, at(0), "easy", "Footing facile", w.mon, week, w.phase));
    }
    const tue = at(1);
    if (tue >= START_DATE) {
      const cat = w.longType === "test" ? "easy" : "quality";
      sessions.push(mkSession(c++, tue, cat, w.quality.title, w.quality.km, week, w.phase));
    }
    if (w.freq >= 3 && w.fri > 0) {
      sessions.push(mkSession(c++, at(4), "easy", "Footing facile", w.fri, week, w.phase));
    }
    const cat = w.longType === "test" ? "test" : "long";
    sessions.push(mkSession(c++, at(6), cat, w.longTitle || "Sortie longue", w.long, week, w.phase));
  });
  return sessions;
}

function getMonthMatrix(year, month){
  const first = new Date(year, month, 1);
  const offset = (first.getDay()+6)%7;
  const start = addDays(first, -offset);
  const weeks = [];
  let cur = start;
  for (let w=0; w<6; w++){
    const row = [];
    for (let d=0; d<7; d++){ row.push(cur); cur = addDays(cur,1); }
    weeks.push(row);
  }
  return weeks;
}

/* ================================================================
   SUPABASE : mappage lignes <-> séances, et accès aux données
   ================================================================ */
function sessionToRow(s){
  return {
    id: s.id, date: s.date, cat: s.cat, title: s.title, km: s.km,
    week: s.week ?? null, phase: s.phase ?? null, completed: !!s.completed,
    actual_km: s.actualKm, actual_min: s.actualMin, notes: s.notes || "",
  };
}
function rowToSession(r){
  return {
    id: r.id, date: r.date, cat: r.cat, title: r.title, km: Number(r.km),
    week: r.week, phase: r.phase, completed: !!r.completed,
    actualKm: r.actual_km != null ? Number(r.actual_km) : null,
    actualMin: r.actual_min != null ? Number(r.actual_min) : null,
    notes: r.notes || "",
  };
}
async function fetchAllSessions(){
  const { data, error } = await supabaseClient.from("sessions").select("*").order("date", { ascending: true });
  if (error) throw error;
  return (data || []).map(rowToSession);
}
async function upsertSessionRemote(session){
  const { error } = await supabaseClient.from("sessions").upsert(sessionToRow(session));
  if (error) throw error;
}
async function deleteSessionRemote(id){
  const { error } = await supabaseClient.from("sessions").delete().eq("id", id);
  if (error) throw error;
}
async function replaceAllRemote(newSessions){
  const { error: delErr } = await supabaseClient.from("sessions").delete().neq("id", "");
  if (delErr) throw delErr;
  const { error: insErr } = await supabaseClient.from("sessions").insert(newSessions.map(sessionToRow));
  if (insErr) throw insErr;
}

/* ================================================================
   ETAT
   ================================================================ */
let sessions = [];
let viewMonth, viewYear;
let modalState = null;       // { mode:'new'|'edit', data:{...}, error? }
let confirmResetVisible = false;
let loading = true;
let loadError = null;
let syncError = null;

/* ================================================================
   RENDU
   ================================================================ */
function render(){
  const app = document.getElementById("app");

  if (!SUPABASE_READY) { app.innerHTML = renderSetupNeeded(); return; }
  if (loading) { app.innerHTML = `<div class="center-msg"><div class="center-msg-inner">Chargement du plan…</div></div>`; return; }
  if (loadError) { app.innerHTML = renderLoadError(); return; }

  const today = todayStr();
  const totalPlannedKm = sessions.reduce((a,s)=>a+s.km, 0);
  const completed = sessions.filter(s=>s.completed);
  const totalDoneKm = completed.reduce((a,s)=>a+(s.actualKm ?? s.km), 0);
  const remainingKm = Math.max(totalPlannedKm - totalDoneKm, 0);

  const { mon, sun } = isoWeekBounds(new Date());
  const weekSessions = sessions.filter(s=>s.date>=mon && s.date<=sun);
  const weekInfo = weekSessions.find(s=>typeof s.week === "number") || weekSessions[0];

  let statusMsg;
  if (today < START_DATE) statusMsg = "Démarre demain";
  else if (RACE_DATE.getTime() <= Date.now()) statusMsg = "Terminé — bravo !";
  else if (weekInfo) statusMsg = `S${weekInfo.week}/32 · ${PHASE_LABELS[weekInfo.phase] || ""}`;
  else statusMsg = "—";

  const html = `
    ${syncError ? renderSyncBanner() : ""}
    ${renderHeader()}
    <div class="wrap">
      ${renderStats(totalDoneKm, totalPlannedKm, remainingKm, completed.length, statusMsg)}
      ${renderCalendarSection(today)}
      ${renderChartSection(weekInfo ? weekInfo.week : null)}
      ${renderPaceSection()}
    </div>
    ${modalState ? renderModal() : ""}
  `;
  app.innerHTML = html;
  tick();
}

function renderSetupNeeded(){
  return `<div class="center-msg"><div class="center-msg-inner">
    <h2>Configuration Supabase requise</h2>
    <p>Ouvrez ce fichier dans un éditeur et remplacez, en haut du <code>&lt;script&gt;</code>,
    <code>SUPABASE_URL</code> et <code>SUPABASE_KEY</code> par les valeurs de votre projet
    (Dashboard Supabase → Settings → API Keys).</p>
  </div></div>`;
}
function renderLoadError(){
  return `<div class="center-msg"><div class="center-msg-inner">
    <h2>Connexion à Supabase impossible</h2>
    <p>Vérifiez l'URL et la clé, que le script SQL a bien été exécuté dans l'éditeur SQL de Supabase, et votre connexion internet.</p>
    <p style="color:#B5453D;font-size:13px;"><strong>Détail :</strong> ${escapeHtml(loadError)}</p>
    <button class="btn-primary" data-action="retry-load">${ICONS.rotate}<span>Réessayer</span></button>
  </div></div>`;
}
function renderSyncBanner(){
  return `<div class="sync-banner"><span>${escapeHtml(syncError)}</span><button data-action="dismiss-sync-error">${ICONS.x}</button></div>`;
}

function renderHeader(){
  return `
  <div class="header">
    <div class="header-inner">
      <div class="eyebrow">${ICONS.mountain}<span>Marathon du Lac d'Annecy</span></div>
      <h1 class="h1">Objectif&nbsp;: passer sous les 4 heures</h1>
      <div class="countdown">
        <div class="countdown-unit"><div class="countdown-value" id="cd-days">--</div><div class="countdown-label">jours</div></div>
        <div class="countdown-unit"><div class="countdown-value" id="cd-hours">--</div><div class="countdown-label">heures</div></div>
        <div class="countdown-unit"><div class="countdown-value" id="cd-min">--</div><div class="countdown-label">minutes</div></div>
        <div class="countdown-unit"><div class="countdown-value" id="cd-sec">--</div><div class="countdown-label">secondes</div></div>
      </div>
      <div class="race-info">Dimanche 18 avril 2027 · 8h00 · Le Pâquier, Annecy</div>
    </div>
    <svg class="mountains" viewBox="0 0 800 60" preserveAspectRatio="none"><polygon points="0,60 0,35 80,10 150,32 230,5 320,30 400,12 470,34 560,8 650,28 720,15 800,33 800,60" fill="#1F6F8B"/></svg>
  </div>`;
}

function renderStats(done, planned, remaining, count, statusMsg){
  return `
  <div class="stats">
    <div class="stat"><div class="stat-label">Km réalisés</div><div class="stat-value">${done.toFixed(0)} / ${planned.toFixed(0)}</div><div class="stat-sub">kilomètres</div></div>
    <div class="stat"><div class="stat-label">Km restants</div><div class="stat-value">${remaining.toFixed(0)}</div><div class="stat-sub">avant le marathon</div></div>
    <div class="stat"><div class="stat-label">Séances</div><div class="stat-value">${count} / ${sessions.length}</div><div class="stat-sub">réalisées</div></div>
    <div class="stat"><div class="stat-label">Semaine</div><div class="stat-value">${statusMsg}</div></div>
  </div>`;
}

function renderPill(s, today){
  const c = CATS[s.cat] || CATS.easy;
  const isPast = s.date < today;
  const missed = isPast && !s.completed && s.cat !== "race";
  return `
    <button class="pill ${missed?"missed":""}" draggable="true" data-session-id="${s.id}"
      style="background:${c.bg};border-color:${c.border};color:${c.color}" title="${escapeHtml(s.title)} — ${s.km} km">
      <div class="pill-title">${s.completed?ICONS.check:""}<span>${s.cat==="race"?"🏁 ":""}${escapeHtml(s.title)}</span></div>
      <div class="pill-km">${s.km} km</div>
    </button>`;
}

function renderCalendarSection(today){
  const matrix = getMonthMatrix(viewYear, viewMonth);
  const byDate = {};
  sessions.forEach(s=>{ (byDate[s.date] = byDate[s.date] || []).push(s); });

  const cells = matrix.flat().map(date=>{
    const ds = fmtDate(date);
    const inMonth = date.getMonth() === viewMonth;
    const isToday = ds === today;
    const daySessions = byDate[ds] || [];
    const pills = daySessions.map(s=>renderPill(s, today)).join("");
    return `
      <div class="day-cell ${inMonth?"":"out"}" data-date="${ds}">
        <span class="day-num ${isToday?"today":""}">${date.getDate()}</span>
        <div>${pills}</div>
      </div>`;
  }).join("");

  return `
  <div class="cal-section">
    <div class="cal-header">
      <div class="cal-nav">
        <button class="icon-btn" data-action="prev-month">${ICONS.chevronLeft}</button>
        <div class="cal-title">${MONTHS_FR[viewMonth]} ${viewYear}</div>
        <button class="icon-btn" data-action="next-month">${ICONS.chevronRight}</button>
      </div>
      <button class="btn-primary" data-action="add-session">${ICONS.plus} Ajouter</button>
    </div>
    <div class="legend">${Object.entries(CATS).map(([k,c])=>`<div class="legend-item"><span class="legend-dot" style="background:${c.color}"></span>${c.label}</div>`).join("")}</div>
    <div class="calendar">
      <div class="cal-weekdays">${DAYS_FR.map(d=>`<div class="cal-weekday">${d}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}

function renderChartSection(currentWeek){
  const totals = {};
  sessions.forEach(s=>{ if (typeof s.week === "number") totals[s.week] = (totals[s.week]||0) + s.km; });
  const bars = Array.from({length:32}, (_,i)=>totals[i+1] || 0);
  const max = Math.max(...bars, 1);
  const barsHtml = bars.map((km,i)=>{
    const week = i+1;
    const isCurrent = week === currentWeek;
    const h = Math.max((km/max)*100, 3);
    return `<div class="bar-col" title="Semaine ${week} — ${km.toFixed(1)} km"><div class="bar ${isCurrent?"current":""}" style="height:${h}%"></div></div>`;
  }).join("");
  return `
  <div class="card">
    <div class="card-title">${ICONS.trendingUp}<span>Volume hebdomadaire sur les 32 semaines</span></div>
    <div class="chart-scroll"><div class="chart-bars" style="min-width:${32*14}px">${barsHtml}</div></div>
    <div class="chart-labels"><span>Sept. 2026</span><span>Avril 2027</span></div>
  </div>`;
}

function renderPaceSection(){
  const rows = [
    ["Footing", "6:00 – 6:30 /km"],
    ["Seuil / tempo", "4:55 – 5:10 /km"],
    ["Fractionné", "4:35 – 4:50 /km"],
    ["Allure marathon", "5:30 – 5:40 /km"],
    ["Semi actuel", "≈ 5:13 /km"],
  ];
  return `
  <div class="card">
    <div class="card-title">${ICONS.info}<span>Repères d'allure (à ajuster selon vos sensations)</span></div>
    <div class="pace-grid">${rows.map(([l,v])=>`<div><div class="pace-label">${l}</div><div class="pace-value">${v}</div></div>`).join("")}</div>
    <div class="pace-note">Ces allures sont estimées à partir de votre semi en 1h50 et affinées via le test grandeur nature de la semaine 20 (24 janvier 2027).</div>
  </div>
  <div class="reset-row">
    ${confirmResetVisible ? `
      <div class="confirm-row">
        <span>Effacer et régénérer le plan pour tout le monde ?</span>
        <button class="btn-danger" data-action="confirm-reset">Confirmer</button>
        <button class="btn-ghost" data-action="cancel-reset">Annuler</button>
      </div>` : `
      <button class="reset-link" data-action="reset-plan">${ICONS.rotate}<span>Réinitialiser le plan</span></button>`}
  </div>`;
}

function renderModal(){
  const { mode, data, error } = modalState;
  const isEdit = mode === "edit";
  return `
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isEdit?"Modifier la séance":"Ajouter une séance"}</div>
        <button class="icon-btn" data-action="close-modal">${ICONS.x}</button>
      </div>
      ${error ? `<div class="modal-error">${escapeHtml(error)}</div>` : ""}
      <div class="field"><label>Titre</label><input id="m-title" value="${escapeHtml(data.title||"")}" placeholder="Ex. Fractionné 6x800m"></div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="m-date" value="${data.date}"></div>
        <div class="field"><label>Distance (km)</label><input id="m-km" value="${data.km??5}" inputmode="decimal"></div>
      </div>
      <div class="field"><label>Type de séance</label>
        <select id="m-cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${data.cat===k?"selected":""}>${c.label}</option>`).join("")}</select>
      </div>
      <div class="field"><label>Notes</label><textarea id="m-notes" rows="2" placeholder="Sensations, météo, allure réelle…">${escapeHtml(data.notes||"")}</textarea></div>
      <label class="checkbox-row"><input type="checkbox" id="m-completed" ${data.completed?"checked":""}><span>Séance réalisée</span></label>
      <div class="field-row" id="m-actual-fields" style="margin-top:12px;display:${data.completed?"grid":"none"}">
        <div class="field"><label>Distance réelle (km)</label><input id="m-actual-km" value="${data.actualKm??data.km??""}" inputmode="decimal"></div>
        <div class="field"><label>Durée (min, optionnel)</label><input id="m-actual-min" value="${data.actualMin??""}" inputmode="decimal"></div>
      </div>
      <div class="modal-footer">
        ${isEdit ? `<button class="btn-delete" data-action="delete-session">${ICONS.trash}<span>Supprimer</span></button>` : "<span></span>"}
        <div style="display:flex;gap:8px;">
          <button class="btn-cancel" data-action="close-modal">Annuler</button>
          <button class="btn-save" data-action="save-session">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ================================================================
   ACTIONS
   ================================================================ */
function openNewModal(date){
  modalState = { mode:"new", data:{ date, cat:"easy", title:"", km:5, notes:"", completed:false, actualKm:null, actualMin:null }, error:null };
  render();
}
function openEditModal(session){
  modalState = { mode:"edit", data:{ ...session }, error:null };
  render();
}
function closeModal(){ modalState = null; render(); }

async function handleSaveSession(){
  const title = document.getElementById("m-title").value.trim();
  if (!title) return;
  const date = document.getElementById("m-date").value;
  const km = parseFloat(document.getElementById("m-km").value.replace(",",".")) || 0;
  const cat = document.getElementById("m-cat").value;
  const notes = document.getElementById("m-notes").value;
  const completed = document.getElementById("m-completed").checked;
  const actualKm = completed ? (parseFloat(document.getElementById("m-actual-km").value.replace(",",".")) || 0) : null;
  const actualMinRaw = document.getElementById("m-actual-min").value;
  const actualMin = completed && actualMinRaw !== "" ? (parseFloat(actualMinRaw.replace(",",".")) || null) : null;

  const base = modalState.data;
  const isNew = modalState.mode === "new";
  const updated = {
    ...base, title, date, km, cat, notes, completed, actualKm, actualMin,
    id: isNew ? ("c" + Date.now()) : base.id,
    week: isNew ? (base.week ?? null) : base.week,
    phase: isNew ? (base.phase || "CUSTOM") : base.phase,
  };

  const saveBtn = document.querySelector('[data-action="save-session"]');
  if (saveBtn) saveBtn.textContent = "Enregistrement…";

  try {
    await upsertSessionRemote(updated);
    if (isNew) sessions.push(updated);
    else sessions = sessions.map(s => s.id === updated.id ? updated : s);
    modalState = null;
    render();
  } catch (err) {
    modalState = { ...modalState, error: "Échec de la sauvegarde : " + (err.message || err) };
    render();
  }
}
async function handleDeleteSession(){
  const id = modalState.data.id;
  try {
    await deleteSessionRemote(id);
    sessions = sessions.filter(s=>s.id!==id);
    modalState = null;
    render();
  } catch (err) {
    modalState = { ...modalState, error: "Échec de la suppression : " + (err.message || err) };
    render();
  }
}
async function moveSession(id, newDate){
  const target = sessions.find(s=>s.id===id);
  if (!target || target.date === newDate) return;
  const updated = { ...target, date: newDate };
  try {
    await upsertSessionRemote(updated);
    sessions = sessions.map(s=> s.id===id ? updated : s);
    render();
  } catch (err) {
    syncError = "Échec du déplacement de la séance : " + (err.message || err);
    render();
  }
}
function changeMonth(delta){
  let m = viewMonth + delta, y = viewYear;
  if (m<0){ m=11; y--; } if (m>11){ m=0; y++; }
  viewMonth = m; viewYear = y;
  render();
}
async function handleConfirmReset(){
  confirmResetVisible = false;
  const def = generateDefaultSessions();
  try {
    await replaceAllRemote(def);
    sessions = def;
    render();
  } catch (err) {
    syncError = "Échec de la réinitialisation : " + (err.message || err);
    render();
  }
}
async function loadFromSupabase(){
  loading = true; loadError = null;
  render();
  try {
    let data = await fetchAllSessions();
    if (!data.length) {
      data = generateDefaultSessions();
      await replaceAllRemote(data);
    }
    sessions = data;
    loading = false;
    render();
  } catch (err) {
    loading = false;
    loadError = (err && err.message) ? err.message : String(err);
    render();
  }
}

async function handleAction(action){
  switch(action){
    case "prev-month": changeMonth(-1); break;
    case "next-month": changeMonth(1); break;
    case "add-session": openNewModal(fmtDate(new Date(viewYear, viewMonth, 1))); break;
    case "close-modal": closeModal(); break;
    case "save-session": await handleSaveSession(); break;
    case "delete-session": await handleDeleteSession(); break;
    case "reset-plan": confirmResetVisible = true; render(); break;
    case "cancel-reset": confirmResetVisible = false; render(); break;
    case "confirm-reset": await handleConfirmReset(); break;
    case "retry-load": await loadFromSupabase(); break;
    case "dismiss-sync-error": syncError = null; render(); break;
  }
}

/* ================================================================
   DELEGATION D'EVENEMENTS (attachee une seule fois)
   ================================================================ */
function attachEventListeners(){
  const app = document.getElementById("app");

  app.addEventListener("click", (e)=>{
    const pill = e.target.closest(".pill");
    if (pill) {
      const s = sessions.find(x=>x.id===pill.dataset.sessionId);
      if (s) openEditModal(s);
      return;
    }
    const actionEl = e.target.closest("[data-action]");
    if (actionEl) { handleAction(actionEl.dataset.action); return; }
    if (e.target.classList.contains("modal-overlay")) { closeModal(); return; }
    const dayCell = e.target.closest(".day-cell");
    if (dayCell) { openNewModal(dayCell.dataset.date); return; }
  });

  app.addEventListener("change", (e)=>{
    if (e.target.id === "m-completed") {
      const fields = document.getElementById("m-actual-fields");
      fields.style.display = e.target.checked ? "grid" : "none";
      if (e.target.checked) {
        const actualKmInput = document.getElementById("m-actual-km");
        if (!actualKmInput.value) actualKmInput.value = document.getElementById("m-km").value;
      }
    }
  });

  app.addEventListener("dragstart", (e)=>{
    const pill = e.target.closest(".pill");
    if (pill) e.dataTransfer.setData("text/plain", pill.dataset.sessionId);
  });
  app.addEventListener("dragover", (e)=>{
    const cell = e.target.closest(".day-cell");
    if (cell) { e.preventDefault(); cell.classList.add("drag-over"); }
  });
  app.addEventListener("dragleave", (e)=>{
    const cell = e.target.closest(".day-cell");
    if (cell) cell.classList.remove("drag-over");
  });
  app.addEventListener("drop", (e)=>{
    const cell = e.target.closest(".day-cell");
    if (cell) {
      e.preventDefault();
      cell.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveSession(id, cell.dataset.date);
    }
  });
}

/* ================================================================
   COMPTE A REBOURS
   ================================================================ */
function tick(){
  const elD = document.getElementById("cd-days");
  if (!elD) return;
  const abs = Math.max(RACE_DATE.getTime() - Date.now(), 0);
  elD.textContent = pad(Math.floor(abs/86400000));
  document.getElementById("cd-hours").textContent = pad(Math.floor((abs%86400000)/3600000));
  document.getElementById("cd-min").textContent = pad(Math.floor((abs%3600000)/60000));
  document.getElementById("cd-sec").textContent = pad(Math.floor((abs%60000)/1000));
}

/* ================================================================
   INITIALISATION
   ================================================================ */
async function init(){
  const now = new Date();
  viewMonth = now.getMonth();
  viewYear = now.getFullYear();

  attachEventListeners();
  render();

  if (!SUPABASE_READY) return;
  await loadFromSupabase();
  setInterval(tick, 1000);
}

document.addEventListener("DOMContentLoaded", init);
</script>
